services:
  octopus:
    image: lorne/octopus
    build:
      context: .
      dockerfile: ./scripts/dockerfiles/Dockerfile.debian
      args:
        TARGETPLATFORM: linux/arm64
    ports:
       - '8030:8080'
    volumes:
       - '/opt/docker-compose/octopus/data:/app/data'
    container_name: octopus
    restart: unless-stopped